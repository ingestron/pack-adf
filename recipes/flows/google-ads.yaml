apiVersion: ingestron.io/v1
kind: Flow
id: google_ads
source: google_ads
ingest:
  uses: adf-table
  with:
    landing: "abfss://landing@syntheticlake.dfs.core.windows.net/native/google-ads"
    query: "SELECT customer.id, customer.descriptive_name FROM customer"
tables:
  google_ads_records:
    object: "orders"
    contract: records
