apiVersion: ingestron.io/v1
kind: Flow
id: azure_databricks_delta
source: azure_databricks_delta
ingest:
  uses: adf-table
  with:
    landing: "abfss://landing@syntheticlake.dfs.core.windows.net/native/azure-databricks-delta"
    runtime_kind: "azure"
    integration_runtime: synthetic-azure-runtime
    source_options: { "staging_sas": "${secret:staging-sas}", "staging_path": "staging/orders" }
tables:
  azure_databricks_delta_records:
    object: "sales.orders"
    contract: records
