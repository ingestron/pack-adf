apiVersion: ingestron.io/v1
kind: Flow
id: sap_hana
source: sap_hana
ingest:
  uses: adf-table
  with:
    landing: "abfss://landing@syntheticlake.dfs.core.windows.net/native/sap-hana"
    query: 'SELECT * FROM "sales"."orders"'
    runtime_kind: "self-hosted"
tables:
  sap_hana_records:
    object: "sales.orders"
    contract: records
