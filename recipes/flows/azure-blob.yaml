apiVersion: ingestron.io/v1
kind: Flow
id: azure_blob
source: azure_blob
ingest:
  uses: adf-files
  with:
    landing: "abfss://landing@syntheticlake.dfs.core.windows.net/native/azure-blob"
    format: "json"
    mode: "all"
tables:
  azure_blob_records:
    object: "exports/orders"
    contract: records
