name: validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
        env:
          # Microsoft's export is the fold's independent check: CI fails without it.
          INGESTRON_REQUIRE_ADF_EXPORT: "1"
      - if: github.event_name == 'pull_request'
        run: pnpm dco:check origin/${{ github.base_ref }}
